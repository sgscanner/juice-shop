name: Owned route A producer
on:
  pull_request:
    types: [synchronize]
    branches: [master]
    paths: [owned-route-a.txt]
permissions:
  contents: read
jobs:
  package:
    if: github.repository == 'sgscanner/juice-shop' && github.event.pull_request.number == 8 && github.event.pull_request.head.repo.full_name == 'wittylion3234/juice-shop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package controlled text as data
        run: cp owned-route-a.txt pr.txt
      - uses: actions/upload-artifact@v4
        with:
          name: owned-route-a-pr
          path: pr.txt
          if-no-files-found: error
