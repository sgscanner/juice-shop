name: Owned canary transport
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]
    paths: [owned-canary-transfer.txt]
permissions:
  contents: read
jobs:
  artifact:
    if: github.repository == 'sgscanner/juice-shop' && github.event.pull_request.head.repo.full_name == 'wittylion3234/juice-shop' && github.event.pull_request.title == 'Owned canary transfer check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Copy test field as data
        run: |
          mkdir -p canary-out
          cp owned-canary-transfer.txt canary-out/field.txt
      - uses: actions/upload-artifact@v4
        with:
          name: owned-canary-transfer
          path: canary-out/field.txt
          if-no-files-found: error
