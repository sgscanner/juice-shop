name: Owned artifact producer

on:
  pull_request_target:
    types: [reopened]
    branches: [master]

permissions:
  contents: read

jobs:
  package:
    if: >-
      github.event.pull_request.number == 5 &&
      github.event.pull_request.head.repo.full_name == 'wittylion3234/juice-shop' &&
      github.event.pull_request.head.ref == 'chore/owned-input-6e3b2808'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Copy contributor fixture as data
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api "repos/wittylion3234/juice-shop/contents/owned-test-input.json?ref=$SOURCE_SHA" --jq '.content' | base64 --decode > owned-test-input.json
          jq -e '.target_pr | type == "number"' owned-test-input.json > /dev/null
          jq -e '.shell_value | type == "string"' owned-test-input.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: owned-input
          path: owned-test-input.json
          retention-days: 1
