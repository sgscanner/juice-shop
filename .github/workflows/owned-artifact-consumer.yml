name: Owned artifact consumer

on:
  workflow_run:
    workflows: ["Owned artifact producer"]
    types: [completed]

permissions: {}

jobs:
  shell:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_target' &&
      github.event.workflow_run.actor.login == 'wittylion3234' &&
      github.event.workflow_run.head_repository.full_name == 'wittylion3234/juice-shop' &&
      github.event.workflow_run.head_branch == 'chore/owned-input-6e3b2808'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: owned-input
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: input
      - name: Read synthetic field
        id: field
        run: |
          set -euo pipefail
          value="$(jq -r '.shell_value' input/owned-test-input.json)"
          printf 'value=%s\n' "$value" >> "$GITHUB_OUTPUT"
      - name: Observe harmless shell expansion
        run: |
          set -euo pipefail
          preview_domain=preview-${{ steps.field.outputs.value }}
          test -f /tmp/owned-artifact-marker-6e3b2808
          echo "Synthetic shell marker observed"

  status:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_target' &&
      github.event.workflow_run.actor.login == 'wittylion3234' &&
      github.event.workflow_run.head_repository.full_name == 'wittylion3234/juice-shop' &&
      github.event.workflow_run.head_branch == 'chore/owned-input-6e3b2808'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: owned-input
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: input
      - name: Set status on the other owned PR
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TARGET_PR: "4"
          EXPECTED_TARGET_BRANCH: "chore/owned-target-6e3b2808"
        run: |
          set -euo pipefail
          target_pr="$(jq -r '.target_pr' input/owned-test-input.json)"
          [[ "$target_pr" =~ ^[0-9]+$ ]]
          test "$target_pr" = "$EXPECTED_TARGET_PR"
          target="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$target_pr")"
          target_repo="$(jq -r '.head.repo.full_name' <<< "$target")"
          target_branch="$(jq -r '.head.ref' <<< "$target")"
          target_sha="$(jq -r '.head.sha' <<< "$target")"
          test "$target_repo" = "$GITHUB_REPOSITORY"
          test "$target_branch" = "$EXPECTED_TARGET_BRANCH"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$target_sha" \
            -f state=success \
            -f context=owned-check/artifact-routing \
            -f description='Owned marker only' > /dev/null
