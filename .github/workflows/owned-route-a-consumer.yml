name: Owned route A consumer
on:
  workflow_run:
    workflows: ["Owned route A producer"]
    types: [completed]
permissions: {}
jobs:
  deploy:
    if: github.repository == 'sgscanner/juice-shop' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.actor.login == 'wittylion3234'
    permissions:
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Select artifact by workflow and name
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: owned-route-a-producer.yml
          name: owned-route-a-pr
          github_token: ${{ github.token }}
          allow_forks: true
      - name: Carry text to output
        id: pr
        run: printf 'value=%s\n' "$(cat pr.txt)" >> "$GITHUB_OUTPUT"
      - name: Test shell assignment with synthetic credential
        env:
          OWNED_CANARY: ${{ secrets.OWNED_CANARY_EXFIL_PROBE_20261013 }}
        run: |
          export DEPLOY_DOMAIN=https://preview-pr-${{ steps.pr.outputs.value }}-owned.invalid
          printf 'route-a-domain=%s\n' "$DEPLOY_DOMAIN"
